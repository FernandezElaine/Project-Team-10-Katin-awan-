<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Katin-awan Portal</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <a href="../index.html" class="auth-logo">🏛️ Katin-awan</a>

        <h1>Log In</h1>
        <p>Access your Katin-awan transparency portal account.</p>
<form id="loginForm" autocomplete="on">
    <label>Email Address</label>
    <input
        type="email"
        id="email"
        name="login_email"
        placeholder="Enter your email"
        autocomplete="username"
        required
    >
<label for="password">Password</label>

<div class="password-field">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
    >

    <button
        type="button"
        id="togglePassword"
        class="password-eye"
        aria-label="Show password"
        aria-pressed="false"
        title="Show password"
    >
        <svg
            id="showPasswordIcon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>

        <svg
            id="hidePasswordIcon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            hidden
        >
            <path d="M3 3l18 18"></path>
            <path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a16.8 16.8 0 0 1-2.1 2.8"></path>
            <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 6 10 6c1.5 0 2.9-.3 4.1-.9"></path>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
        </svg>
    </button>
</div>

    <div class="login-options">
        <label class="remember-option">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
        </label>

        <a href="#" id="forgotPasswordLink">
            Forgot password?
        </a>
    </div>

    <button type="submit">Log In</button>
</form>

        <div class="auth-links">
            <p>Don’t have an account?</p>
            <a href="register.html">Create Account</a>
        </div>

        <a href="../index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth-nav.js"></script>
<script src="../js/login.js"></script>

</body>
</html>
